[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tgcli"
version = "0.1.0"
description = "CLI for your Telegram account via Pyrogram (MTProto): search dialogs, read history, send messages and files, export chats."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pyrogram>=2.0.100",
    "click>=8.0",
    "qrcode>=7.4,<9",
    "python-dotenv>=1.0",
    "tgcrypto>=1.2.5",
]

[project.scripts]
tgcli = "tgcli.cli:main"

[tool.setuptools.packages.find]
include = ["tgcli*"]
